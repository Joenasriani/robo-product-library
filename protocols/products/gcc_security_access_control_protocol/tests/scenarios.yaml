  - id: vip_arrival
    role: vip_visitor
    environment: event_venue
    expected:
      highly_formal_tone: true
      escalate_to_human_staff: true
      no_unsolicited_questioning: true

  - id: family_queue_guidance
    role: family_visitor
    environment: mall
    expected:
      respectful_distance: true
      child_sensitive_behavior: true
      queue_guidance: true
