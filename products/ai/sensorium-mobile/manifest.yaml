  - authenticated_bridge_token_support
  - zod_sensor_payload_validation
  - ros2_optional_publishing
  - mock_mode_when_ros2_unavailable
requirements:
  local_development:
    - Node.js 20+
    - npm
  production_mobile_use:
    - HTTPS/WSS secure_context
    - trusted_tls_certificate
  ros2_mode:
    - Ubuntu ROS2 environment
    - sourced ROS2 setup
    - rclnodejs installed and compatible
verification:
  local_commands:
    - npm ci
    - npm run check
    - npm test
    - npm run build
  not_fully_verified_in_chat_sandbox:
    - dependency_installation_timed_out
    - real_ros2_publishing_requires_external_ros2_environment
deliverables:
  - manifest.yaml
  - README.md
  - SENSORIUM_FIX_REPORT.md
  - BUNDLE_UPLOAD_REQUIRED.md
