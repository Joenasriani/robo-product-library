fulfillment_method: manual_delivery_after_inquiry_approval
store_positioning: independent_sellable_product
commercial_truth:
  sellable_independently: true
  one_click_saas: false
  requires_customer_environment_validation: true
  ros2_publishing_requires_external_runtime: true
  recommended_listing_status: inquiry_only
capabilities:
  - mobile_camera_streaming
  - mobile_imu_streaming
  - mobile_gps_streaming
  - mobile_audio_streaming
