product:
  id: gcc-hospital-reception-protocol-v1
  name: GCC Hospital Reception Protocol
  version: 1.0.0
  risk_level: medium
runtime_policy:
  decision_model: rules_first
  human_supervision_required: true
  requires_operator_approval: false
  fallback_behavior: handoff_to_human_on_low_confidence_or_sensitive_request
coverage:
  supported_countries:
  - saudi_arabia
  - united_arab_emirates
  - qatar
  - kuwait
  - bahrain
  - oman
  supported_use_cases:
  - Hospital reception
  - Patient intake direction
  - Visitor desk triage guidance
  - Department wayfinding
  - Queue support in admission areas
constraints:
  limitations:
  - No diagnosis, triage decisions, or treatment advice
  - Medical record access remains with authorized hospital staff
  - Requires on-site supervisors for emergency escalations
  required_capabilities: []
  dependencies:
  - Robot behavior runtime capable of loading YAML policy files
  - On-site operator escalation workflow
  - Venue-specific map/directory data for navigation prompts
rule_sources:
  core_policy_files:
  - core/base_policy.yaml
  - core/country_overlays.yaml
  - core/role_rules.yaml
  - core/safety_overrides.yaml
  test_scenarios:
  - tests/acceptance_criteria.yaml
  - tests/scenarios.yaml
  documentation:
  - README.md
  - docs/setup.md
  - docs/compatibility.md
