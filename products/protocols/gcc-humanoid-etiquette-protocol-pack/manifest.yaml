  - protocol.json
  - ros2_action_mapping.md
  - validation_checklist.md
  - integration_notes.md
inputs:
  sensors:
    - vision
    - lidar
    - audio
    - operator_override
outputs:
  ros2_actions:
    - NavigateToPose
    - FollowWaypoints
    - Speak
    - PlayGesture
    - SetFaceExpression
    - ServeItem
    - StopMotion
    - YieldPath
    - RequestHumanAssistance
