id: gcc-humanoid-etiquette-protocol-pack
name: GCC Humanoid Etiquette Protocol Pack
product_type: robotics_protocol_pack
category: protocols
commercial_status: draft_ready_for_marketplace_review
intended_buyers:
  - robotics integrators
  - humanoid robot developers
  - hospitality automation teams
  - mall and premium residential robotics operators
primary_environment: GCC hospitality, majlis, reception, mall concierge, and premium residential spaces
supported_robot_classes:
  - humanoid service robot
  - mobile social robot with ROS 2 action support
  - reception or hospitality robot
