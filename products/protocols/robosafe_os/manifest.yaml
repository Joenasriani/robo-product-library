commercial_tier: professional
sales_mode: inquiry_only
status: inquiry_only
price_aed: null
deliverable_type: robotics_deployment_protocol_pack
fulfillment_method: manual_delivery_after_inquiry_approval
customer_receives:
- Facility safety policy template customized from intake data
- Routing rules schema and sample output
- Incident log template
- Human review and escalation template
- Browser-based facility routing demonstration
best_for:
- GCC hotels planning service or delivery robot deployment
- Malls planning cleaning, patrol, or wayfinding robots
- Hospitals planning delivery or reception support robots
- Warehouses planning AMR route governance
- Premium residential buildings planning concierge or delivery robots
dependencies:
- Facility map or zone list supplied by buyer
- Robot capability sheet supplied by buyer or vendor
- On-site human operator workflow
hardware_requirements:
- Robot platform with safe mobility stack supplied by vendor or integrator
- Human-accessible review workflow supplied by facility or integrator
software_requirements:
- Policy reader or implementation engineer to translate pack into robot runtime rules
- Facility operations team to review site-specific constraints
compatibility_notes: >-
  This pack is runtime-agnostic. It does not ship a certified robot controller.
  Implementation into ROS2, Nav2, vendor fleet software, or other middleware requires
  a qualified integrator.
setup_time_estimate: 4-8 hours for document tailoring; integration time depends on facility and robot stack
support_scope: Remote review of completed intake, one protocol revision pass, and clarification of package files.
license_type: commercial_internal_deployment_license
limitations:
- Does not replace certified safety engineering, local regulatory review, or site inspection.
- Does not connect directly to robots without custom integration.
- Does not claim ISO, IEC, civil defense, hospital, or municipal compliance certification.
- Browser demo is explanatory only and is not a physics simulator.
qa_status: acceptance_criteria_defined_with_manual_qa_checklist
