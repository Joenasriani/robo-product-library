- saudi_arabia
- united_arab_emirates
- qatar
- kuwait
- bahrain
- oman
supported_facility_types:
- hotel
- mall
- hospital
- warehouse
- premium_residential
supported_robot_types:
- service_robot
- delivery_robot
- cleaning_robot
- reception_robot
- patrol_robot
- autonomous_mobile_robot
risk_level: high
requires_operator_approval: true
human_supervision_required: true
required_inputs:
- facility_type
- robot_type
- zones
- restricted_areas
- human_traffic_patterns
- task_schedule
- escalation_contacts
- incident_severity_levels
deliverables:
- README.md
- RULES.yaml
- docs/buyer_overview.md
- docs/deployment_workflow.md
- docs/limitations.md
